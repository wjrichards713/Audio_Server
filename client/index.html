<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Streaming Client</title>
</head>

<body>
    <h1>Audio Streaming Client</h1>
    <div>
        <input type="text" id="wss" placeholder="Enter Websocket URL" value="" style="width: 100%;">
        <br />
        <button id="connectWsBtn" onclick="connectWebsocket()">Connect Websocket</button>
        <button id="disconnectWsBtn" onclick="disconnectWebsocket()" style="display: none;">Disconnect
            Websocket</button>
        <br /><br />
        <label for="ip">Server Address:</label>
        <input type="text" id="ip" placeholder="Enter server IP" value="audio.redenes.org">
        <input type="number" id="port" placeholder="Enter server port" value="">
    </div>
    <br /><br />
    <button id="connectBtn111" onclick="connectUdp(111)">Connect to 111 Channel</button>
    <button id="disconnectBtn111" onclick="disconnectUdp(111)" style="display: none;">Disconnect to 111 Channel</button>
    <button id="startBtn111" onclick="startAudio(111)">Start Sending Audio</button>
    <button id="stopBtn111" onclick="stopAudio(111)" style="display: none;">Stop Sending Audio</button>
    <br /><br />
    <button id="connectBtn222" onclick="connectUdp(222)">Connect to 222 Channel</button>
    <button id="disconnectBtn222" onclick="disconnectUdp(222)" style="display: none;">Disconnect to 222 Channel</button>
    <button id="startBtn222" onclick="startAudio(222)">Start Sending Audio</button>
    <button id="stopBtn222" onclick="stopAudio(222)" style="display: none;">Stop Sending Audio</button>
    <br /><br />
    <button id="connectBtn333" onclick="connectUdp(333)">Connect to 333 Channel</button>
    <button id="disconnectBtn333" onclick="disconnectUdp(333)" style="display: none;">Disconnect to 333 Channel</button>
    <button id="startBtn333" onclick="startAudio(333)">Start Sending Audio</button>
    <button id="stopBtn333" onclick="stopAudio(333)" style="display: none;">Stop Sending Audio</button>
    <br /><br />
    <button id="connectBtn444" onclick="connectUdp(444)">Connect to 444 Channel</button>
    <button id="disconnectBtn444" onclick="disconnectUdp(444)" style="display: none;">Disconnect to 444 Channel</button>
    <button id="startBtn444" onclick="startAudio(444)">Start Sending Audio</button>
    <button id="stopBtn444" onclick="stopAudio(444)" style="display: none;">Stop Sending Audio</button>
    <br /><br />
    <button id="connectBtn555" onclick="connectUdp(555)">Connect to 555 Channel</button>
    <button id="disconnectBtn555" onclick="disconnectUdp(555)" style="display: none;">Disconnect to 555 Channel</button>
    <button id="startBtn555" onclick="startAudio(555)">Start Sending Audio</button>
    <button id="stopBtn555" onclick="stopAudio(555)" style="display: none;">Stop Sending Audio</button>
    <br /><br />
    <button id="connectBtn666" onclick="connectUdp(666)">Connect to 666 Channel</button>
    <button id="disconnectBtn666" onclick="disconnectUdp(666)" style="display: none;">Disconnect to 666 Channel</button>
    <button id="startBtn666" onclick="startAudio(666)">Start Sending Audio</button>
    <button id="stopBtn666" onclick="stopAudio(666)" style="display: none;">Stop Sending Audio</button>
    <br /><br />
    <button id="connectBtn777" onclick="connectUdp(777)">Connect to 777 Channel</button>
    <button id="disconnectBtn777" onclick="disconnectUdp(777)" style="display: none;">Disconnect to 777 Channel</button>
    <button id="startBtn777" onclick="startAudio(777)">Start Sending Audio</button>
    <button id="stopBtn777" onclick="stopAudio(777)" style="display: none;">Stop Sending Audio</button>
    <br /><br />
    <button id="connectBtn888" onclick="connectUdp(888)">Connect to 888 Channel</button>
    <button id="disconnectBtn888" onclick="disconnectUdp(888)" style="display: none;">Disconnect to 888 Channel</button>
    <button id="startBtn888" onclick="startAudio(888)">Start Sending Audio</button>
    <button id="stopBtn888" onclick="stopAudio(888)" style="display: none;">Stop Sending Audio</button>
    <br /><br />
    <button id="connectBtn999" onclick="connectUdp(999)">Connect to 999 Channel</button>
    <button id="disconnectBtn999" onclick="disconnectUdp(999)" style="display: none;">Disconnect to 999 Channel</button>
    <button id="startBtn999" onclick="startAudio(999)">Start Sending Audio</button>
    <button id="stopBtn999" onclick="stopAudio(999)" style="display: none;">Stop Sending Audio</button>
    <br /><br />
    <div id="status"></div>
    <script>
        let ws;
        let audioContext, mediaStream, audioPort;
        async function fetchUdpPort() {
            const response = await fetch('/audio-server-port');
            const data = await response.json();
            document.getElementById("wss").value = `wss://audio.redenes.org/ws/?websocket_id=${data.websocket_id}`;
            document.getElementById("port").value = data.udp_port;
            console.log(data);
            return data;
        }
        async function connectWebsocket() {
            const wsUrl = document.getElementById("wss").value;
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                console.log("WebSocket connection opened:", wsUrl);
                document.getElementById('connectWsBtn').style.display = 'none';
                document.getElementById('disconnectWsBtn').style.display = 'inline-block';
            };
            ws.onmessage = (event) => {
                console.log("Received WebSocket message:", event.data);
                if (event.data == "ping") {
                    ws.send("pong");
                }
            };
            ws.onerror = (error) => {
                console.error("WebSocket error:", error);
            };
            ws.onclose = async () => {
                console.log("WebSocket connection closed");
                await stopAudio(111);
                await stopAudio(222);
                await stopAudio(333);
                await stopAudio(444);
                await stopAudio(555);
                await stopAudio(666);
                await stopAudio(777);
                await stopAudio(888);
                await stopAudio(999);
                await disconnectUdp(111);
                await disconnectUdp(222);
                await disconnectUdp(333);
                await disconnectUdp(444);
                await disconnectUdp(555);
                await disconnectUdp(666);
                await disconnectUdp(777);
                await disconnectUdp(888);
                await disconnectUdp(999);
                document.getElementById('connectWsBtn').style.display = 'inline-block';
                document.getElementById('disconnectWsBtn').style.display = 'none';
            };
        }
        async function disconnectWebsocket() {
            await ws.close();
            ws = undefined;
        }
        async function connectUdp(channel_id) {
            if (!ws) {
                document.getElementById('status').textContent = `WebSocket Not Connected`;
            }
            if (ws.readyState != 1) {
                alert("WebSocket Connection Closed");
            }
            const port = document.getElementById('port').value;
            if (!port) {
                document.getElementById('status').textContent = `Please input Channel Id and port`;
            }
            audioPort = port;
            ws.send(JSON.stringify({
                connect: {
                    channel_id,
                    affiliation_id: '',
                    user_name: '',
                    agency_name: '',
                    time: Date.now()
                }
            }));
            window.electronAPI.send({ channel: channel_id, audioPort, audioPacket: new Float32Array(1920).fill(0) });
            document.getElementById('connectBtn' + channel_id).style.display = 'none';
            document.getElementById('disconnectBtn' + channel_id).style.display = 'inline-block';
        }
        async function disconnectUdp(channel_id) {
            if (!ws) {
                document.getElementById('status').textContent = `WebSocket Not Connected`;
            }
            if (ws.readyState != 1) {
                alert("WebSocket Connection Closed");
            }
            ws.send(JSON.stringify({
                disconnect: {
                    channel_id,
                    affiliation_id: '',
                    user_name: '',
                    agency_name: '',
                    time: Date.now()
                }
            }));
            document.getElementById('connectBtn' + channel_id).style.display = 'inline-block';
            document.getElementById('disconnectBtn' + channel_id).style.display = 'none';
        }
        async function startAudio(channel) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.error('Audio capturing not supported in this browser.');
                return;
            }
            if (mediaStream) {
                return alert("Already sending to different channel");
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        // deviceId: "d7398de6a333b1296b04f2bc1629c2c4df06d567ac90a7a5845b281c783c393c",
                        echoCancellation: true,
                        noiseSuppression: true, // Optional: reduces background noise
                        autoGainControl: true   // Optional: adjusts the microphone input level automatically
                    }
                });
                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(mediaStream);

                // const processor = audioContext.createScriptProcessor(4096, 1, 1);
                // processor.onaudioprocess = (event) => {
                //     const audioPacket = event.inputBuffer.getChannelData(0);
                //     window.electronAPI.send({ audioPort, audioPacket });
                // };
                // source.connect(processor);
                // processor.connect(audioContext.destination);

                await audioContext.audioWorklet.addModule("processor.js");
                const workletNode = new AudioWorkletNode(audioContext, "audio-processor", {
                    processorOptions: { frameSize: 4800 }
                });
                workletNode.port.onmessage = (event) => {
                    // console.log(event);
                    window.electronAPI.send({ channel, audioPort, audioPacket: event.data });
                };
                source.connect(workletNode);
                // workletNode.connect(audioContext.destination);

                console.log('Audio capturing started.');

                document.getElementById('startBtn' + channel).style.display = 'none';
                document.getElementById('stopBtn' + channel).style.display = 'inline-block';
            } catch (error) {
                console.error('Error capturing audio:', error);
            }
        }
        function stopAudio(channel) {
            if (audioContext) {
                audioContext.close().then(() => console.log('Audio context closed.'));
                audioContext = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                console.log('Media stream stopped.');
                mediaStream = null;
            }
            document.getElementById('startBtn' + channel).style.display = 'inline-block';
            document.getElementById('stopBtn' + channel).style.display = 'none';
        }
        fetchUdpPort();

        const audioCtx = new AudioContext({ sampleRate: 48000 });
        const audioQueue = [];
        let playing = false;
        let lastTimestamp = 0;

        // Opus Decoder
        const audioDecoder = new AudioDecoder({
            output: (pcmFrame) => {
                console.log("PCM Frame Received:", pcmFrame);

                const numFrames = pcmFrame.numberOfFrames; // Should be 4800 for 60ms @ 48kHz
                const numChannels = pcmFrame.numberOfChannels;
                const sampleRate = pcmFrame.sampleRate;
                const allocationSize = pcmFrame.allocationSize({ planeIndex: 0 });
                const pcmData = new Float32Array(allocationSize / 4);
                const duration = pcmFrame.duration / 1000000;

                // Copy PCM Data
                pcmFrame.copyTo(pcmData, { planeIndex: 0 });

                // Add frame to queue
                audioQueue.push({ pcmData, numFrames, numChannels, sampleRate, timestamp: performance.now(), duration });

                // Start playback if not already running
                if (!playing) {
                    playing = true;
                    playBufferedAudio();
                }
            },
            error: (err) => console.error("Decoding error:", err),
        });

        // Configure Opus decoder
        audioDecoder.configure({ codec: "opus", sampleRate: 48000, numberOfChannels: 1 });

        // Function to play buffered PCM frames with 60ms spacing
        function playBufferedAudio() {
            if (audioQueue.length === 0) {
                playing = false;
                return;
            }

            const { pcmData, numFrames, numChannels, sampleRate, duration } = audioQueue.shift();
            const buffer = audioCtx.createBuffer(numChannels, numFrames, sampleRate);

            buffer.copyToChannel(pcmData, 0);

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);

            // Ensure frames are played at exactly 60ms intervals
            const currentTime = audioCtx.currentTime;
            const playbackTime = Math.max(currentTime, lastTimestamp + duration);

            source.start(playbackTime);
            lastTimestamp = playbackTime;

            // Schedule next frame after 60ms
            setTimeout(playBufferedAudio, (duration * 1000) - 10);
        }

        var timeout = null;
        // Listen for Opus stream and decode
        window.electronAPI.on("stream", ({channel_id, decryptedData}) => {
            clearTimeout(timeout);
            const btn = document.getElementById("disconnectBtn"+channel_id);
            btn.style.backgroundColor = "green";
            timeout = setTimeout(() => {
                btn.style.backgroundColor = "#efefef";
            }, 500);
            audioDecoder.decode(
                new EncodedAudioChunk({
                    type: "key",
                    timestamp: performance.now() * 1000, // Ensure correct timing
                    duration: 100000, // 100ms in microseconds
                    data: decryptedData,
                })
            );
        });
    </script>
</body>

</html>
