<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Streaming Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Audio Streaming Client</h1>
        
        <!-- Connection Settings -->
        <div class="space-y-4 mb-8">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">WebSocket URL</label>
                <input type="text" id="wss" placeholder="Enter Websocket URL" value="" 
                    class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Affiliation ID</label>
                    <input type="text" id="affiliationId" value="f064c9f1-31e5-47d9-b5f2-d94edc90dc91" 
                        class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">User Name</label>
                    <input type="text" id="userName" value="John Doe" 
                        class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Agency Name</label>
                    <input type="text" id="agencyName" value="REDENES" 
                        class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <div class="flex space-x-4">
                <button id="connectWsBtn" onclick="connectWebsocket()" 
                    class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-md transition-colors">
                    Connect Websocket
                </button>
                <button id="disconnectWsBtn" onclick="disconnectWebsocket()" 
                    class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-md transition-colors hidden">
                    Disconnect Websocket
                </button>
            </div>
        </div>

        <!-- Server Settings -->
        <div class="space-y-4 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Server Address</label>
                    <input type="text" id="ip" value="audio.redenes.org" 
                        class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Server Port</label>
                    <input type="number" id="port" placeholder="Enter server port" 
                        class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
        </div>

        <!-- Channel Controls -->
        <div class="space-y-4">
            <div class="flex space-x-4">
                <input type="text" id="channelId" placeholder="Enter Channel ID" 
                    class="flex-1 px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <button onclick="addChannel()" 
                    class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-md transition-colors">
                    Add Channel
                </button>
            </div>
            
            <div id="activeChannels" class="space-y-4"></div>
        </div>

        <!-- Status Display -->
        <div id="status" class="mt-8 p-4 bg-gray-50 rounded-md text-gray-700"></div>
    </div>

    <script>
        let ws;
        let audioContext, mediaStream, audioPort;
        let activeChannels = new Set();

        function addChannel() {
            const channelId = document.getElementById('channelId').value;
            if (!channelId || activeChannels.has(channelId)) return;
            
            const channelDiv = document.createElement('div');
            channelDiv.id = `channel-${channelId}`;
            channelDiv.className = 'p-4 bg-gray-50 rounded-lg';
            channelDiv.innerHTML = `
                <div class="flex items-center space-x-4">
                    <span class="text-lg font-medium">Channel ${channelId}</span>
                    <button id="connectBtn${channelId}" onclick="connectUdp(${channelId})"
                        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition-colors">
                        Connect
                    </button>
                    <button id="disconnectBtn${channelId}" onclick="disconnectUdp(${channelId})"
                        class="hidden bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md transition-colors">
                        Disconnect
                    </button>
                    <button id="startBtn${channelId}" onclick="startAudio(${channelId})"
                        class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md transition-colors">
                        Start Audio
                    </button>
                    <button id="stopBtn${channelId}" onclick="stopAudio(${channelId})"
                        class="hidden bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-md transition-colors">
                        Stop Audio
                    </button>
                    <button onclick="removeChannel(${channelId})"
                        class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md transition-colors">
                        Remove
                    </button>
                </div>
            `;
            document.getElementById('activeChannels').appendChild(channelDiv);
            activeChannels.add(channelId);
            document.getElementById('channelId').value = '';
        }

        function removeChannel(channelId) {
            if (document.getElementById(`stopBtn${channelId}`).style.display === 'inline-block') {
                stopAudio(channelId);
            }
            if (document.getElementById(`disconnectBtn${channelId}`).style.display === 'inline-block') {
                disconnectUdp(channelId);
            }
            document.getElementById(`channel-${channelId}`).remove();
            activeChannels.delete(channelId);
        }

        function sendChannelConnect(channelId) {
            if (!ws || ws.readyState !== 1) return;
            
            const affiliationId = document.getElementById('affiliationId').value;
            const userName = document.getElementById('userName').value;
            const agencyName = document.getElementById('agencyName').value;
            
            ws.send(JSON.stringify({
                connect: {
                    affiliation_id: affiliationId,
                    user_name: userName,
                    agency_name: agencyName,
                    channel_id: channelId,
                    time: Math.floor(Date.now() / 1000)
                }
            }));
        }

        async function fetchUdpPort() {
            const response = await fetch('/audio-server-port');
            const data = await response.json();
            document.getElementById("wss").value = `wss://audio.redenes.org/ws/?websocket_id=${data.websocket_id}`;
            document.getElementById("port").value = data.udp_port;
            console.log(data);
            return data;
        }

        async function connectWebsocket() {
            const wsUrl = document.getElementById("wss").value;
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                console.log("WebSocket connection opened:", wsUrl);
                document.getElementById('connectWsBtn').classList.add('hidden');
                document.getElementById('disconnectWsBtn').classList.remove('hidden');
                document.getElementById('status').textContent = `WebSocket Connected`;
                document.getElementById('status').classList.add('text-green-600');
                activeChannels.forEach(channelId => {
                    sendChannelConnect(channelId);
                });
            };
            ws.onmessage = (event) => {
                console.log("Received WebSocket message:", event.data);
                if (event.data == "ping") {
                    ws.send("pong");
                }
            };
            ws.onerror = (error) => {
                console.error("WebSocket error:", error);
                document.getElementById('status').classList.add('text-red-600');
            };
            ws.onclose = async () => {
                console.log("WebSocket connection closed");
                document.getElementById('status').textContent = `WebSocket Disconnected`;
                document.getElementById('status').classList.remove('text-green-600');
                document.getElementById('status').classList.add('text-red-600');
                activeChannels.forEach(async channelId => await stopAudio(channelId));
                activeChannels.forEach(async channelId => await disconnectUdp(channelId));
                document.getElementById('connectWsBtn').classList.remove('hidden');
                document.getElementById('disconnectWsBtn').classList.add('hidden');
            };
        }

        async function disconnectWebsocket() {
            await ws.close();
            ws = undefined;
        }

        async function connectUdp(channel_id) {
            if (!ws) {
                document.getElementById('status').textContent = `WebSocket Not Connected`;
                return;
            }
            if (ws.readyState != 1) {
                alert("WebSocket Connection Closed");
                return;
            }
            const port = document.getElementById('port').value;
            if (!port) {
                document.getElementById('status').textContent = `Please input Channel Id and port`;
                return;
            }
            audioPort = port;
            sendChannelConnect(channel_id);
            document.getElementById('connectBtn' + channel_id).classList.add('hidden');
            window.electronAPI.send({ channel: channel_id, audioPort, audioPacket: new Float32Array(1920).fill(0) });
            document.getElementById('disconnectBtn' + channel_id).classList.remove('hidden');
        }

        async function disconnectUdp(channel_id) {
            if (!ws) {
                document.getElementById('status').textContent = `WebSocket Not Connected`;
                return;
            }
            document.getElementById('connectBtn' + channel_id).classList.remove('hidden');
            document.getElementById('disconnectBtn' + channel_id).classList.add('hidden');
            if (ws.readyState != 1) {
                alert("WebSocket Connection Closed");
                return;
            }
            const affiliationId = document.getElementById('affiliationId').value;
            const userName = document.getElementById('userName').value;
            const agencyName = document.getElementById('agencyName').value;

            ws.send(JSON.stringify({
                disconnect: {
                    channel_id,
                    affiliation_id: affiliationId,
                    user_name: userName,
                    agency_name: agencyName,
                    time: Date.now()
                }
            }));
        }

        async function startAudio(channel) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                document.getElementById('status').textContent = `Audio capturing not supported in this browser.`;
                return;
            }
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                document.getElementById('status').textContent = `WebSocket is not connected. Please connect WebSocket first.`;
                return;
            }
            if (!audioPort) {
                document.getElementById('status').textContent = `UDP is not connected for this channel. Please connect UDP first.`;
                return;
            }
            if (mediaStream) {
                console.error('Audio capturing not supported in this browser.');
                return alert("Already sending to different channel");
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(mediaStream);

                await audioContext.audioWorklet.addModule("processor.js");
                const workletNode = new AudioWorkletNode(audioContext, "audio-processor", {
                    processorOptions: { frameSize: 4800 }
                });
                workletNode.port.onmessage = (event) => {
                    window.electronAPI.send({ channel, audioPort, audioPacket: event.data });
                };
                source.connect(workletNode);

                console.log('Audio capturing started.');

                document.getElementById('startBtn' + channel).classList.add('hidden');
                document.getElementById('stopBtn' + channel).classList.remove('hidden');
            } catch (error) {
                console.error('Error capturing audio:', error);
                document.getElementById('status').textContent = `Error capturing audio: ${error.message}`;
            }
        }

        function stopAudio(channel) {
            if (audioContext) {
                audioContext.close().then(() => console.log('Audio context closed.'));
                audioContext = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                console.log('Media stream stopped.');
                mediaStream = null;
            }
            document.getElementById('startBtn' + channel).classList.remove('hidden');
            document.getElementById('stopBtn' + channel).classList.add('hidden');
        }

        fetchUdpPort();

        const audioCtx = new AudioContext({ sampleRate: 48000 });
        const audioQueue = [];
        let playing = false;
        let lastTimestamp = 0;

        const audioDecoder = new AudioDecoder({
            output: (pcmFrame) => {
                console.log("PCM Frame Received:", pcmFrame);

                const numFrames = pcmFrame.numberOfFrames;
                const numChannels = pcmFrame.numberOfChannels;
                const sampleRate = pcmFrame.sampleRate;
                const allocationSize = pcmFrame.allocationSize({ planeIndex: 0 });
                const pcmData = new Float32Array(allocationSize / 4);
                const duration = pcmFrame.duration / 1000000;

                pcmFrame.copyTo(pcmData, { planeIndex: 0 });
                audioQueue.push({ pcmData, numFrames, numChannels, sampleRate, timestamp: performance.now(), duration });

            // Start playback if not already running
            if (!playing) {
                playing = true;
                playBufferedAudio();
            }
        },
        error: (err) => console.error("Decoding error:", err),
    });

    // Configure Opus decoder
    audioDecoder.configure({ codec: "opus", sampleRate: 48000, numberOfChannels: 1 });

    // Function to play buffered PCM frames with 60ms spacing
    function playBufferedAudio() {
        if (audioQueue.length === 0) {
            playing = false;
            return;
        }

        const { pcmData, numFrames, numChannels, sampleRate, duration } = audioQueue.shift();
        const buffer = audioCtx.createBuffer(numChannels, numFrames, sampleRate);

        buffer.copyToChannel(pcmData, 0);

        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);

        // Ensure frames are played at exactly 60ms intervals
        const currentTime = audioCtx.currentTime;
        const playbackTime = Math.max(currentTime, lastTimestamp + duration);

        source.start(playbackTime);
        lastTimestamp = playbackTime;

        // Schedule next frame after 60ms
        setTimeout(playBufferedAudio, (duration * 1000) - 10);
    }

    var timeout = null;
    // Listen for Opus stream and decode
    window.electronAPI.on("stream", ({channel_id, decryptedData}) => {
        clearTimeout(timeout);
        const btn = document.getElementById("disconnectBtn"+channel_id);
        btn.style.backgroundColor = "#b9ffd7";
        timeout = setTimeout(() => {
            btn.style.backgroundColor = "transparent";
        }, 500);
        audioDecoder.decode(
            new EncodedAudioChunk({
                type: "key",
                timestamp: performance.now() * 1000, // Ensure correct timing
                duration: 100000, // 100ms in microseconds
                data: decryptedData,
            })
        );
    });
</script>
</body>

</html>
