<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Streaming Client</title>
</head>

<body>
    <h1>Audio Streaming Client</h1>
    <div>
        <input type="text" id="wss" placeholder="Enter Websocket URL" value="" style="width: 100%;">
        <br/>
        <button id="connectWsBtn" onclick="connectWebsocket()">Connect Websocket</button>
        <br/><br/>
        <label for="ip">Server IP:</label>
        <input type="text" id="ip" placeholder="Enter server IP" value="146.190.123.218">
        <input type="number" id="port" placeholder="Enter server port" value="">
    </div>
    <button id="connectBtn" onclick="connectUdp()">Connect to Channel</button>
    <button id="startBtn" onclick="startAudio()">Start Sending Audio</button>
    <button id="stopBtn" onclick="stopAudio()" style="display: none;">Stop Sending Audio</button>
    <div id="status"></div>
    <script>
        let ws;
        let audioContext, mediaStream, audioPort;
        async function fetchUdpPort() {
            const response = await fetch('/audio-server-port');
            const data = await response.json();
            document.getElementById("wss").value = `wss://redenes.olecons.com/ws/?websocket_id=${data.websocket_id}`;
            document.getElementById("port").value = data.udp_port;
            console.log(data);
            return data;
        }
        async function connectWebsocket() {
            const wsUrl = document.getElementById("wss").value;
            ws = new WebSocket(wsUrl);
            var interval;
            ws.onopen = () => {
                console.log("WebSocket connection opened:", wsUrl);
                interval = setInterval(() => {
                    ws.send("ping");
                }, 30000);
            };
            ws.onmessage = (event) => {
                console.log("Received WebSocket message:", event.data);
            };
            ws.onerror = (error) => {
                console.error("WebSocket error:", error);
            };
            ws.onclose = () => {
                console.log("WebSocket connection closed");
                clearInterval(interval);
            };
        }
        async function connectUdp() {
            if(!ws) {
                document.getElementById('status').textContent = `WebSocket Not Connected`;
            }
            if(ws.readyState != 1) {
                alert("WebSocket Connection Closed");
            }
            const port = document.getElementById('port').value;
            audioPort = port;
            ws.send(JSON.stringify({connect: {
                channel_id: '555',
                affiliation_id: '',
                user_name: '',
                agency_name: '',
                time: Date.now()
            }}));
            document.getElementById('status').textContent = `Connected to UDP`;
            window.electronAPI.send({ audioPort, audioPacket: new Float32Array(4096).fill(0) });
        }

        async function startAudio() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.error('Audio capturing not supported in this browser.');
                return;
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: {
                    echoCancellation: true,
                    noiseSuppression: true, // Optional: reduces background noise
                    autoGainControl: true   // Optional: adjusts the microphone input level automatically
                } });
                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(mediaStream);
                const processor = audioContext.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = (event) => {
                    const audioPacket = event.inputBuffer.getChannelData(0);
                    window.electronAPI.send({ audioPort, audioPacket });
                };

                source.connect(processor);
                processor.connect(audioContext.destination);
                console.log('Audio capturing started.');
                
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'inline-block';
            } catch (error) {
                console.error('Error capturing audio:', error);
            }
        }

        function stopAudio() {
            if (audioContext) {
                audioContext.close().then(() => console.log('Audio context closed.'));
                audioContext = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                console.log('Media stream stopped.');
                mediaStream = null;
            }
            
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
        }
        fetchUdpPort();
    </script>
</body>

</html>
