        // Function to start capturing and sending audio

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

                return;

            try {

                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    const audioContext = new AudioContext();
                    const source = audioContext.createMediaStreamSource(stream);
                    const processor = audioContext.createScriptProcessor(4096, 1, 1);

                    processor.onaudioprocess = (event) => {
                        const audioPacket = event.inputBuffer.getChannelData(0);
                        window.electronAPI.send({audioPort, audioPacket});
                    };

                    source.connect(processor);
                    processor.connect(audioContext.destination);
                }).catch(err => console.error('Microphone access error:', err));

        const audioContext2 = new (window.AudioContext || window.webkitAudioContext)({
            sampleRate: 48000,
        });
        window.electronAPI.on('play-audio', (pcmArray) => {

            // ✅ Convert back to Int16Array
            const pcmBuffer = new Int16Array(pcmArray);

            // ✅ Ensure PCM buffer size is valid (avoid noise issues)
            if (pcmBuffer.length % 1920 !== 0) {
                console.warn(`PCM buffer size mismatch: ${pcmBuffer.length}, trimming to multiple of 1920`);
                const newSize = Math.floor(pcmBuffer.length / 1920) * 1920;
                pcmBuffer = pcmBuffer.slice(0, newSize);
            }

            // ✅ Convert Int16 PCM to Float32 PCM for Web Audio
            const audioBuffer = audioContext2.createBuffer(1, pcmBuffer.length, 48000);
            const channelData = audioBuffer.getChannelData(0);

            for (let i = 0; i < pcmBuffer.length; i++) {
                channelData[i] = pcmBuffer[i] / 32768.0; // Convert to Float32
            }

            const source = audioContext2.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext2.destination);
            source.start();
