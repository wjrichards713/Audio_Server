<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDP Audio Chat</title>
</head>
<body>
    <h1>UDP Audio Chat</h1>
    <button id="startBtn">Start Audio Transmission</button>
    <audio id="audioPlayer" controls></audio>

    <script>
        const dgram = require('dgram');
        const mic = require('mic');

        const UDP_SERVER_IP = '127.0.0.1';  // Change to your backend server IP if required
        let UDP_PORT;

        // Fetch available UDP port from backend
        async function getAvailablePort() {
            try {
                const response = await fetch('/audio-server-port');
                const data = await response.json();
                UDP_PORT = data.udp_port;
                console.log(`Using UDP Port: ${UDP_PORT}`);
                listenForIncomingAudio();
            } catch (error) {
                console.error('Error fetching available UDP port:', error);
            }
        }

        // Capture microphone audio and send via UDP
        function startAudioTransmission() {
            if (!UDP_PORT) {
                console.error('UDP Port not set. Please try again.');
                return;
            }

            const socket = dgram.createSocket('udp4');
            const micInstance = mic({
                rate: '48000',
                channels: '1',
                debug: false,
                encoding: 'linear16'
            });

            const micInputStream = micInstance.getAudioStream();
            micInputStream.on('data', (data) => {
                socket.send(data, UDP_PORT, UDP_SERVER_IP, (err) => {
                    if (err) {
                        console.error('Error sending audio packet:', err);
                    } else {
                        console.log(`Sent audio packet to ${UDP_SERVER_IP}:${UDP_PORT}`);
                    }
                });
            });

            micInstance.start();
            console.log('Audio transmission started...');
        }

        // Listen for incoming audio packets and play them
        function listenForIncomingAudio() {
            const socket = dgram.createSocket('udp4');
            socket.bind(UDP_PORT, () => {
                console.log(`Listening for incoming audio on UDP port ${UDP_PORT}`);
            });

            socket.on('message', (msg) => {
                const audioBlob = new Blob([msg], { type: 'audio/wav' });
                const audioURL = URL.createObjectURL(audioBlob);
                document.getElementById('audioPlayer').src = audioURL;
                console.log('Received and playing audio');
            });
        }

        // Event listener for start button
        document.getElementById('startBtn').addEventListener('click', () => {
            startAudioTransmission();
        });

        // Get the available port on page load
        getAvailablePort();
    </script>
</body>
</html>
