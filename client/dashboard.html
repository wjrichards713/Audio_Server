<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>Audio Server Dashboard</title>
</head>
<body class="bg-gray-100 p-6">
<div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Audio Server Dashboard</h1>
    
    <!-- Stats Overview -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Active Sockets</h2>
            <p id="socketCount" class="text-3xl font-bold text-blue-600">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Active Users</h2>
            <p id="userCount" class="text-3xl font-bold text-green-600">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Active Channels</h2>
            <p id="channelCount" class="text-3xl font-bold text-purple-600">0</p>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Total Stream Viewers</h2>
            <p id="streamViewersCount" class="text-3xl font-bold text-orange-600">0</p>
        </div>
    </div>

    <!-- Live Streaming Users -->
    <div class="bg-white rounded-lg shadow p-6 mb-8">
        <h2 class="text-xl font-semibold text-gray-900 mb-4">Live Streaming Users per Channel</h2>
        <div id="liveStreamingUsers" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>

    <!-- Detailed Information -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- UDP Sockets -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">UDP Sockets Alloted</h2>
            <div id="udpSockets" class="space-y-4"></div>
        </div>

        <!-- Connected Users -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">Connected Users</h2>
            <div id="connectedUsers" class="space-y-4"></div>
        </div>

        <!-- Channel Members -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">Channel Members</h2>
            <div id="channelMembers" class="space-y-4"></div>
        </div>

        <!-- UDP Clients -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">UDP Clients</h2>
            <div id="udpClients" class="space-y-4"></div>
        </div>
    </div>
</div>

<script>
    function updateDashboard() {
        // Fetch regular dashboard data
        fetch('/audio-server-connected-users')
            .then(response => response.json())
            .then(data => {
                // Update counts
                document.getElementById('socketCount').textContent = Object.keys(data.udpSockets || {}).length;
                document.getElementById('userCount').textContent = Object.keys(data.users || {}).length;
                document.getElementById('channelCount').textContent = Object.keys(data.members || {}).length;

                // Update UDP Sockets
                const udpSocketsDiv = document.getElementById('udpSockets');
                udpSocketsDiv.innerHTML = Object.entries(data.udpSockets || {}).map(([port, socket]) => `
                    <div class="border rounded-lg p-4 bg-gray-50">
                        <div class="font-semibold text-gray-700">Port: ${port}</div>
                        <div class="text-sm text-gray-600">Type: ${socket.type}</div>
                    </div>
                `).join('');

                // Update Connected Users
                const connectedUsersDiv = document.getElementById('connectedUsers');
                connectedUsersDiv.innerHTML = Object.entries(data.users || {}).map(([port, user]) => `
                    <div class="border rounded-lg p-4 bg-gray-50">
                        <div class="font-semibold text-gray-700">${port}</div>
                        <div class="text-sm text-gray-600">Agency: ${user.agency_name}</div>
                        <div class="text-sm text-gray-600">UserName: ${user.user_name}</div>
                        <div class="text-sm text-gray-600">Affiliation ID: ${user.affiliation_id}</div>
                    </div>
                `).join('');

                // Update Channel Members
                const channelMembersDiv = document.getElementById('channelMembers');
                channelMembersDiv.innerHTML = Object.entries(data.members || {}).map(([channelId, members]) => `
                    <div class="border rounded-lg p-4 bg-gray-50">
                        <div class="font-semibold text-gray-700">Channel: ${channelId}</div>
                        <div class="text-sm text-gray-600">Members: ${members.join(', ') || 'No members'}</div>
                    </div>
                `).join('');

                // Update UDP Clients
                const udpClientsDiv = document.getElementById('udpClients');
                udpClientsDiv.innerHTML = Object.entries(data.udpClients || {}).map(([port, client]) => `
                    <div class="border rounded-lg p-4 bg-gray-50">
                        <div class="font-semibold text-gray-700">Port: ${port}</div>
                        <div class="text-sm text-gray-600">Address: ${client.address}</div>
                        <div class="text-sm text-gray-600">Port: ${client.port}</div>
                        <div class="text-sm text-gray-600">Family: ${client.family}</div>
                    </div>
                `).join('');
            })
            .catch(error => console.error('Error fetching data:', error));

        // Fetch live streaming users data
        fetch('https://streaming.redenes.org/users')
            .then(response => response.json())
            .then(data => {
                // Calculate total viewers
                const totalViewers = data.reduce((sum, channel) => sum + channel.users, 0);
                document.getElementById('streamViewersCount').textContent = totalViewers;

                // Update live streaming users
                const liveStreamingUsersDiv = document.getElementById('liveStreamingUsers');
                
                if (data.length === 0) {
                    liveStreamingUsersDiv.innerHTML = '<div class="col-span-full text-center p-4 text-gray-500">No active streaming channels</div>';
                } else {
                    liveStreamingUsersDiv.innerHTML = data.map(channel => `
                        <div class="border rounded-lg p-4 bg-gray-50">
                            <div class="font-semibold text-gray-700">Channel: ${channel.channel_id}</div>
                            <div class="flex items-center mt-2">
                                <div class="flex-1 bg-gray-200 rounded-full h-2.5">
                                    <div class="bg-orange-600 h-2.5 rounded-full" style="width: ${Math.min(100, channel.users * 5)}%"></div>
                                </div>
                                <span class="ml-2 text-lg font-bold text-orange-600">${channel.users}</span>
                            </div>
                            <div class="text-xs text-gray-500 mt-1">Live viewers</div>
                        </div>
                    `).join('');
                }
            })
            .catch(error => console.error('Error fetching streaming data:', error));
    }

    // Update every second
    updateDashboard();
    setInterval(updateDashboard, 1000);
</script>
</body>
</html>
