<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC with RTPEngine</title>
</head>
<body>
  <h1>WebRTC with RTPEngine</h1>
  <label for="remoteUser">Remote User ID:</label>
  <input id="remoteUser" type="text" placeholder="Enter User ID to connect">
  <button id="start" onclick="startCall()">Start Call</button>
  <video id="localVideo" autoplay muted></video>
  <video id="remoteVideo" autoplay></video>

  <script>
    const ws = new WebSocket("wss://redenes.olecons.com/ws/");
    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");

    let localUserId = null;
    let remoteUserId = null;
    const pc = new RTCPeerConnection();

    ws.onmessage = async (message) => {
      const { type, userId, sdp, candidate, from } = JSON.parse(message.data);

      if (type === "welcome") {
        localUserId = userId;
        console.log(`Your User ID: ${localUserId}`);
      } else if (type === "offer") {
        remoteUserId = from;
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(
          JSON.stringify({ type: "answer", targetUserId: remoteUserId, sdp: answer })
        );
      } else if (type === "answer") {
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      } else if (type === "candidate") {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      }
    };

    pc.onicecandidate = (event) => {
      if (event.candidate && remoteUserId) {
        ws.send(
          JSON.stringify({
            type: "candidate",
            targetUserId: remoteUserId,
            candidate: event.candidate,
          })
        );
      }
    };

    pc.ontrack = (event) => {
      remoteVideo.srcObject = event.streams[0];
    };

    async function startCall() {
      remoteUserId = document.getElementById("remoteUser").value;
      if (!remoteUserId) {
        alert("Please enter a remote User ID");
        return;
      }

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      stream.getTracks().forEach((track) => pc.addTrack(track, stream));
      localVideo.srcObject = stream;

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: "offer", targetUserId, sdp: offer }));
    }
  </script>
</body>
</html>
